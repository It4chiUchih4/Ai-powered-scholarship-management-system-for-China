services:
  - type: web
    name: scholarify
    runtime: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader && php artisan config:clear && php artisan route:clear && php artisan view:clear
    startCommand: php -S 0.0.0.0:$PORT -t public
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stack
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: scholarify-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: scholarify-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: scholarify-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: scholarify-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: scholarify-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: scholarify-db
          property: connectionString

databases:
  - name: scholarify-db
    plan: free
    databaseName: scholarify
    user: scholarify
