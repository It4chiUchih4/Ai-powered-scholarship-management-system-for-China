services:
  - type: web
    name: scholarify
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: base64:8vK9mP2qR5tY7wX0zA3bC6dE9fG1hI4jK7lM0nO3pQ=
      - key: APP_DEBUG
        value: true
      - key: LOG_CHANNEL
        value: stack
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: scholarify-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: scholarify-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: scholarify-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: scholarify-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: scholarify-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: scholarify-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database

databases:
  - name: scholarify-db
    plan: free
    databaseName: scholarify
    user: scholarify
